name: 🐛 Bug Report
description: Report something that isn't working as expected in My Wallet
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the details below so it can be reproduced and fixed quickly.
        For security vulnerabilities, please do **not** open a public issue — see [SECURITY.md](../../SECURITY.md) instead.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Tap on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened instead?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / logs
      description: If applicable, add screenshots or log output to help explain the problem.

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Found in Settings, or the version in pubspec.yaml / build you used.
      placeholder: "1.0.0+1"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "e.g. Pixel 7, Samsung Galaxy S22"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS version
      placeholder: "e.g. Android 14"
    validations:
      required: true

  - type: input
    id: flutter-version
    attributes:
      label: Flutter version (if building from source)
      placeholder: "flutter --version output"

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else relevant to this bug.
